<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
<title id="t">BlackIce feature map</title><desc id="d">A grouped overview of BlackIce firewall control, network intelligence, and system tools.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111d"/><stop offset="1" stop-color="#14283a"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#04dbe7"/><stop offset="1" stop-color="#247fff"/></linearGradient><style>.title{font:700 32px 'Segoe UI',Arial;fill:#f5f8ff}.sub{font:16px 'Segoe UI',Arial;fill:#a9b9ca}.head{font:700 20px 'Segoe UI',Arial;fill:#00e3e9}.card{fill:#111f2d;stroke:#31546d;stroke-width:1.7}.name{font:700 18px 'Segoe UI',Arial;fill:#eef7ff}.desc{font:14px 'Segoe UI',Arial;fill:#b8c7d6}.num{font:700 22px 'Segoe UI',Arial;fill:#071320}</style></defs>
<rect width="1400" height="760" rx="26" fill="url(#g)"/><text x="60" y="65" class="title">BLACKICE Δ · FUNCTIONAL MAP</text><text x="60" y="95" class="sub">One Windows desktop workspace for firewall policy and network context</text>
<text x="60" y="155" class="head">01 / FIREWALL CONTROL</text>
<g>
<rect x="60" y="180" width="300" height="150" rx="15" class="card"/><circle cx="100" cy="220" r="22" fill="url(#a)"/><text x="100" y="228" class="num" text-anchor="middle">R</text><text x="138" y="226" class="name">System Rules</text><text x="85" y="270" class="desc">Review and manage supported</text><text x="85" y="292" class="desc">local Windows Firewall rules.</text>
<rect x="385" y="180" width="300" height="150" rx="15" class="card"/><circle cx="425" cy="220" r="22" fill="url(#a)"/><text x="425" y="228" class="num" text-anchor="middle">Z</text><text x="463" y="226" class="name">Network Zones</text><text x="410" y="270" class="desc">View active Windows profiles,</text><text x="410" y="292" class="desc">networks and policy state.</text>
<rect x="710" y="180" width="300" height="150" rx="15" class="card"/><circle cx="750" cy="220" r="22" fill="url(#a)"/><text x="750" y="228" class="num" text-anchor="middle">A</text><text x="788" y="226" class="name">App Blocking</text><text x="735" y="270" class="desc">Create application rules for</text><text x="735" y="292" class="desc">supported Win32 executables.</text>
<rect x="1035" y="180" width="300" height="150" rx="15" class="card"/><circle cx="1075" cy="220" r="22" fill="url(#a)"/><text x="1075" y="228" class="num" text-anchor="middle">K</text><text x="1113" y="226" class="name">Internet Kill Switch</text><text x="1060" y="270" class="desc">Manual IPv4/IPv6 Internet block</text><text x="1060" y="292" class="desc">with local/intranet scopes excluded.</text>
</g>
<text x="60" y="390" class="head">02 / NETWORK INTELLIGENCE</text>
<g>
<rect x="60" y="415" width="300" height="150" rx="15" class="card"/><circle cx="100" cy="455" r="22" fill="#9a7ae4"/><text x="100" y="463" class="num" text-anchor="middle">IP</text><text x="138" y="461" class="name">IP Lists</text><text x="85" y="505" class="desc">Separate blocked and allowed</text><text x="85" y="527" class="desc">address lists and rule actions.</text>
<rect x="385" y="415" width="300" height="150" rx="15" class="card"/><circle cx="425" cy="455" r="22" fill="#9a7ae4"/><text x="425" y="463" class="num" text-anchor="middle">D</text><text x="463" y="461" class="name">DNS Diagnostics</text><text x="410" y="505" class="desc">Resolver, cache and available</text><text x="410" y="527" class="desc">Windows DNS event context.</text>
<rect x="710" y="415" width="300" height="150" rx="15" class="card"/><circle cx="750" cy="455" r="22" fill="#9a7ae4"/><text x="750" y="463" class="num" text-anchor="middle">C</text><text x="788" y="461" class="name">Connections</text><text x="735" y="505" class="desc">TCP sessions, process context</text><text x="735" y="527" class="desc">and LAN neighbour information.</text>
<rect x="1035" y="415" width="300" height="150" rx="15" class="card"/><circle cx="1075" cy="455" r="22" fill="#9a7ae4"/><text x="1075" y="463" class="num" text-anchor="middle">T</text><text x="1113" y="461" class="name">Terminal &amp; Statistics</text><text x="1060" y="505" class="desc">Network diagnostics, event</text><text x="1060" y="527" class="desc">history and activity summaries.</text>
</g>
<text x="60" y="625" class="head">03 / SYSTEM TOOLS</text>
<rect x="60" y="650" width="610" height="75" rx="13" class="card"/><text x="88" y="680" class="name">IP Mask · Visual privacy</text><text x="88" y="705" class="desc">Masks IP strings inside the app UI; it does not anonymize network traffic or exported files.</text>
<rect x="700" y="650" width="635" height="75" rx="13" class="card"/><text x="728" y="680" class="name">System Settings · Optional NOVA AI</text><text x="728" y="705" class="desc">Local preferences and operator-configured optional integration.</text>
</svg>