<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="lt ld">
<title id="lt">BlackIce offline licensing workflow</title><desc id="ld">The customer client creates a license request file, the administrator reviews and signs it in a separate offline License Manager, and the client verifies the signed token using a public key and the local hardware identifier.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1522"/><stop offset="1" stop-color="#17283a"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#35d7df"/></marker><style>.h{font:700 27px 'Segoe UI',Arial;fill:#f4f8ff}.s{font:15px 'Segoe UI',Arial;fill:#a9bacb}.box{fill:#14283a;stroke:#25b9c8;stroke-width:2}.p{font:700 20px 'Segoe UI',Arial;fill:#edfbff}.d{font:14px 'Segoe UI',Arial;fill:#b8c8d8}.line{stroke:#35d7df;stroke-width:2.6;fill:none;marker-end:url(#ar)}.tag{font:700 13px 'Segoe UI',Arial;fill:#09202a}</style></defs>
<rect width="1400" height="430" rx="24" fill="url(#bg)"/><text x="55" y="58" class="h">OFFLINE LICENSE LIFECYCLE</text><text x="55" y="88" class="s">The request and signature flow is deliberately separate from firewall operation.</text>
<rect x="55" y="145" width="260" height="185" rx="16" class="box"/><text x="185" y="190" text-anchor="middle" class="p">Customer Client</text><text x="185" y="226" text-anchor="middle" class="d">Name · e-mail · hardware ID</text><text x="185" y="251" text-anchor="middle" class="d">Requested term · USER / DEV</text><rect x="110" y="275" width="150" height="33" rx="8" fill="#00dbe8"/><text x="185" y="297" text-anchor="middle" class="tag">.blreq / BIREQ1</text>
<path d="M315 237 H390" class="line"/><text x="352" y="217" text-anchor="middle" class="s">E-mail draft</text>
<rect x="400" y="145" width="260" height="185" rx="16" class="box"/><text x="530" y="190" text-anchor="middle" class="p">Admin License Manager</text><text x="530" y="226" text-anchor="middle" class="d">Import · verify · review</text><text x="530" y="251" text-anchor="middle" class="d">Choose type and validity</text><rect x="455" y="275" width="150" height="33" rx="8" fill="#00dbe8"/><text x="530" y="297" text-anchor="middle" class="tag">Offline signing</text>
<path d="M660 237 H735" class="line"/><text x="698" y="217" text-anchor="middle" class="s">Signed token</text>
<rect x="745" y="145" width="260" height="185" rx="16" class="box"/><text x="875" y="190" text-anchor="middle" class="p">Protected Vault</text><text x="875" y="226" text-anchor="middle" class="d">SQLCipher database</text><text x="875" y="251" text-anchor="middle" class="d">Encrypted RSA private key</text><rect x="800" y="275" width="150" height="33" rx="8" fill="#b58bff"/><text x="875" y="297" text-anchor="middle" class="tag">.bivault recovery</text>
<path d="M1005 237 H1080" class="line"/><text x="1043" y="217" text-anchor="middle" class="s">.blic / BI2</text>
<rect x="1090" y="145" width="260" height="185" rx="16" class="box"/><text x="1220" y="190" text-anchor="middle" class="p">Client Verification</text><text x="1220" y="226" text-anchor="middle" class="d">RSA-PSS / SHA-256</text><text x="1220" y="251" text-anchor="middle" class="d">Product + hardware + expiry</text><rect x="1145" y="275" width="150" height="33" rx="8" fill="#00d88c"/><text x="1220" y="297" text-anchor="middle" class="tag">Local validation</text>
<text x="55" y="382" class="s">No license server is required. E-mail is prepared as a draft; the operator reviews it and sends it manually. No payment processing or central instant revocation is included.</text>
</svg>